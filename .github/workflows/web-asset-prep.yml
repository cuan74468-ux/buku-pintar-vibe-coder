name: DVC web derivative preparation
on:
  pull_request:
    branches: [main]
    paths: ['tools/build-web-assets.py','.github/workflows/web-asset-prep.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/build-web-assets.py
      - name: Verify checked-in web derivatives
        run: git diff --exit-code -- assets/web/cover.webp assets/web/mockup.webp assets/web/reader-content.zip

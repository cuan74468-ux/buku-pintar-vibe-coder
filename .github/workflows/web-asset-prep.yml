name: DVC web derivative preparation
on:
  pull_request:
    branches: [main]
    paths: ['tools/build-web-assets.py','.github/workflows/web-asset-prep.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/build-web-assets.py
      - name: Export public derivatives for reviewed static commit
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib
          for p in sorted(Path('assets/web').iterdir()):
              b=p.read_bytes()
              s=base64.b64encode(b).decode()
              print('DVC_ASSET_BEGIN '+p.name+' '+str(len(b))+' '+hashlib.sha256(b).hexdigest())
              for i in range(0,len(s),4000): print('DVC_ASSET_CHUNK '+p.name+' '+s[i:i+4000])
              print('DVC_ASSET_END '+p.name)
          PY

name: Library redesign browser QA
on:
  pull_request:
    branches: [main]
    paths: ['index.html','buku-pintar-vibe-coder-edisi-1.html','baca.html','css/**','js/**','tests/**','.github/workflows/library-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/library-server.log 2>&1 &
          node tests/library-browser.cjs
          node tests/analytics-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-browser-screenshots
          path: qa-*.png
          if-no-files-found: ignore

name: GO LIVE 3 read-only audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/go-live-audit.cjs'
      - 'tests/go-live-audit.py'
      - '.github/workflows/go-live-audit.yml'
permissions:
  contents: read
jobs:
  artifact-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: command -v pdfinfo && command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - run: python3 tests/go-live-audit.py
  browser-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/go-live-audit.cjs
